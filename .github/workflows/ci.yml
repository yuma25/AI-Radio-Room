name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # ユーザー環境に合わせて 1.22 を基準とする

      - name: Setup Dependencies
        run: |
          pnpm install
          cd backend && go mod tidy

      - name: Run Quality Checks (pnpm check)
        run: pnpm check
