<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Radio Room</title>
    <style>
      /* FOUC対策: JSとCSSの読み込みが終わるまで画面を隠す */
      body {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- テーマ入力モーダル -->
      <div id="theme-modal" class="modal-overlay">
        <div class="modal-content neumorphic-panel">
          <h2>番組設定</h2>
          <p>本日のトークテーマを入力してください</p>
          <input type="text" id="modal-theme-input" class="neumorphic-input" placeholder="例：未来の技術について" />
          
          <!-- BGM設定 -->
          <div class="setting-item" style="display: flex; align-items: center; gap: 10px; padding: 0 10px;">
            <input type="checkbox" id="modal-bgm-toggle" checked style="width: 20px; height: 20px; cursor: pointer;" />
            <label for="modal-bgm-toggle" style="font-size: 0.9rem; cursor: pointer; color: var(--text-main); font-weight: bold;">BGMを再生する</label>
          </div>

          <button id="modal-start-btn" class="neumorphic-button-wide primary">放送準備完了</button>
        </div>
      </div>

      <!-- カウントダウン演出用オーバーレイ -->
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <div class="countdown-circle">
          <span id="countdown-number">10</span>
        </div>
        <p class="countdown-text">PREPARING BROADCAST...</p>
      </div>

      <!-- メインエリア -->
      <main class="main-layout">
        <!-- グラスモーフィズムなヘッダー（プレイヤー風） -->
        <header class="glass-header">
          <div class="player-info">
            <div id="on-air-indicator" class="status-dot"></div>
            <div class="header-titles">
              <h1 id="program-title">AI Radio Player</h1>
              <div id="current-theme-display" class="theme-display hidden">本日のテーマ: <span></span></div>
            </div>
          </div>
          <button id="back-to-home-btn" class="neumorphic-button-wide hidden" style="margin-left: auto; padding: 0.5rem 1rem; font-size: 0.8rem; height: auto; box-shadow: none; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">ホームに戻る</button>
        </header>

        <!-- モニターエリア（ラジオブース風） -->
        <section id="monitor-area" class="monitor-container">
          <div class="visualizer-overlay">
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
          </div>
          
          <div class="studio-booth">
            <div id="avatar-mc" class="avatar-box mc">
              <div class="avatar-circle">めたん</div>
              <span class="label">MAIN MC</span>
            </div>
            <div id="avatar-guest-a" class="avatar-box guest-a">
              <div class="avatar-circle">ずんだ</div>
              <span class="label">GUEST A</span>
            </div>
            <div id="avatar-guest-b" class="avatar-box guest-b">
              <div class="avatar-circle">つむぎ</div>
              <span class="label">GUEST B</span>
            </div>
          </div>

          <div class="ticker-panel neumorphic-panel">
            <div class="ticker-header">
              <span id="active-speaker-name" class="speaker-tag">-</span>
              <span class="live-tag">LIVE CAPTION</span>
            </div>
            <div id="subtitle-text" class="subtitle-text">放送待機中...</div>
          </div>
        </section>

        <!-- コントロールエリア（ニューモーフィズム） -->
        <footer class="controls neumorphic-panel">
          <div class="input-group center">
            <!-- 音量コントロール -->
            <div class="mixer-channel volume-control">
              <label for="bgm-volume" class="mixer-label">BGM VOL</label>
              <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.1" />
            </div>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
