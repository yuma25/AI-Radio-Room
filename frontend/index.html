<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Radio Room</title>
  </head>
  <body>
    <div id="app">
      <!-- メインエリア -->
      <main class="main-layout">
        <!-- グラスモーフィズムなヘッダー（プレイヤー風） -->
        <header class="glass-header">
          <div class="player-info">
            <div id="on-air-indicator" class="status-dot"></div>
            <h1 id="program-title">AI Radio Player</h1>
          </div>
        </header>

        <!-- メッセージエリア（ニューモーフィズムなカード） -->
        <section id="chat-area" class="chat-container">
          <div id="message-list" class="message-list">
            <!-- セリフが追加される -->
          </div>
        </section>

        <!-- コントロールエリア（ニューモーフィズム） -->
        <footer class="controls neumorphic-panel">
          <div class="input-group">
            <input type="text" id="theme-input" class="neumorphic-input" placeholder="テーマを入力..." />
            <button id="start-broadcast" class="neumorphic-button primary">
              <span class="icon">▶</span>
            </button>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
