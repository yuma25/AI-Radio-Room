services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: voicevox_engine
    ports:
      - "50021:50021"
    restart: unless-stopped
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_radio_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - voicevox
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_radio_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
